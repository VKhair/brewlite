name: Release to Lightsail

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: brewlite-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install Lightsail container plugin
        run: |
          curl --fail --silent --show-error --location https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /tmp/lightsailctl
          sudo install -m 0755 /tmp/lightsailctl /usr/local/bin/lightsailctl
      - name: Deploy and run smoke checks
        env:
          AWS_PAGER: ''
          LIGHTSAIL_WEB: ${{ vars.LIGHTSAIL_WEB }}
          LIGHTSAIL_API: ${{ vars.LIGHTSAIL_API }}
          BREWLITE_BOOTSTRAP_CATALOG: ${{ vars.BREWLITE_BOOTSTRAP_CATALOG }}
          LIGHTSAIL_DB: ${{ vars.LIGHTSAIL_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
        run: node scripts/deploy-lightsail.mjs
