$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}",
      "fullName": "Khách Hàng Test Postman"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rnd = Date.now();
      pm.environment.set('customerEmail', `customer_${rnd}@brewlite.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () {
          pm.response.to.have.status(201);
      });
      pm.test('Tài khoản mới', function () {
          const res = pm.response.json();
          pm.expect(res.user.email).to.eql(pm.environment.get('customerEmail'));
          pm.expect(res.user.role).to.eql('CUSTOMER');
      });
    language: text/javascript
order: 1000
