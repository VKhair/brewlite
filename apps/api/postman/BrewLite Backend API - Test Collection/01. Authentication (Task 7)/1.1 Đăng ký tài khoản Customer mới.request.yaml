$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}",
      "name": "Khách Hàng Test Postman"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rnd = Date.now();
      pm.environment.set('customerEmail', `customer_${rnd}@brewlite.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 hoặc 201 (Created)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test('Đăng ký thành công và trả về thông tin user', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.property('id');
          pm.expect(res.data.email).to.eql(pm.environment.get('customerEmail'));
      });
    language: text/javascript
order: 1000
