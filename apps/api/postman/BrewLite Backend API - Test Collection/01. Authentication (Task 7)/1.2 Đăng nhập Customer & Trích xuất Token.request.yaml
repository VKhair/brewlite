$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Trả về accessToken và gán customerToken vào Environment', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res).to.have.property('accessToken');
          pm.environment.set('customerToken', res.accessToken);
          pm.expect(res.user.role).to.eql('CUSTOMER');
      });
    language: text/javascript
order: 2000
