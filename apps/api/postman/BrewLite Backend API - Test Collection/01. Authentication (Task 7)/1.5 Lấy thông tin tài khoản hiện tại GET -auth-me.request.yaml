$kind: http-request
name: 1.5 Lấy thông tin tài khoản hiện tại GET /auth/me
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Trả về đúng thông tin user của token', function () {
          const res = pm.response.json();
          pm.expect(res.email).to.eql(pm.environment.get('customerEmail'));
          pm.expect(res.role).to.eql('CUSTOMER');
      });
    language: text/javascript
order: 5000
