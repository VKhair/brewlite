$kind: http-request
name: 1.5 Route cũ GET /auth/me trả 404
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
