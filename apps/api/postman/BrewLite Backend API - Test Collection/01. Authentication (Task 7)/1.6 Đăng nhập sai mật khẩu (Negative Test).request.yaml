$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "wrong_password_999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 6000
