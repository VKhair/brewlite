$kind: http-request
name: 2.2 Lấy chi tiết sản phẩm ID 1 GET /products/1
url: "{{baseUrl}}/products/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Sản phẩm ID 1 là Cà phê Sữa Đá', function () {
          const res = pm.response.json();
          pm.expect(res.id).to.eql(1);
          pm.expect(res.name).to.eql('Cà phê Sữa Đá');
          pm.expect(res.price).to.eql(35000);
      });
    language: text/javascript
order: 2000
