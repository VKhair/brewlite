$kind: http-request
name: 2.2 Lấy chi tiết Cà phê sữa theo UUID
url: "{{baseUrl}}/products/10000000-0000-4000-8000-000000000001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.id).to.eql('10000000-0000-4000-8000-000000000001');
          pm.expect(res.sizes).to.be.an('array').that.is.not.empty;
      });
    language: text/javascript
order: 2000
