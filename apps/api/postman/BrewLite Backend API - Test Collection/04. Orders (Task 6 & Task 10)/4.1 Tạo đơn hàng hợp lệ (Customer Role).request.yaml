$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": 1,
          "size": "M",
          "toppings": ["pearl", "cheese"],
          "quantity": 1
        }
      ],
      "couponCode": "BREWLITE10"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 hoặc 201 (Created)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test('Đơn được tạo trạng thái PENDING và lưu orderId, orderCode', function () {
          const res = pm.response.json();
          pm.expect(res.status).to.eql('PENDING');
          pm.expect(res).to.have.property('id');
          pm.expect(res).to.have.property('orderCode');
          pm.environment.set('orderId', res.id);
          pm.environment.set('orderCode', res.orderCode);
          pm.expect(res.items.length).to.eql(1);
      });
    language: text/javascript
order: 1000
