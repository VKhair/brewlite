$kind: http-request
name: 4.3 Tạo đơn với JWT Admin
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "10000000-0000-4000-8000-000000000001",
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () {
          pm.response.to.have.status(201);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.status).to.eql('PENDING');
      });
    language: text/javascript
order: 3000
