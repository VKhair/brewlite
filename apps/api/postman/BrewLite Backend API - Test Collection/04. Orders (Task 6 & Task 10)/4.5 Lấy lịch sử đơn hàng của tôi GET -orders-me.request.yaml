$kind: http-request
name: 4.5 Lấy lịch sử đơn hàng của tôi GET /orders/me
url: "{{baseUrl}}/orders/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Danh sách đơn hàng của khách chứa đơn vừa tạo', function () {
          const res = pm.response.json();
          pm.expect(Array.isArray(res)).to.be.true;
          const found = res.some(o => o.orderCode === pm.environment.get('orderCode'));
          pm.expect(found).to.be.true;
      });
    language: text/javascript
order: 5000
