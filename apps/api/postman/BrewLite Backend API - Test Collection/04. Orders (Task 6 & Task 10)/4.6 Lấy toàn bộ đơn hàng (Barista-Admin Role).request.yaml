$kind: http-request
name: 4.6 Lấy toàn bộ đơn hàng (Barista/Admin Role)
url: "{{baseUrl}}/orders"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{baristaToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK cho Barista', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Staff xem được toàn bộ danh sách đơn', function () {
          const res = pm.response.json();
          pm.expect(Array.isArray(res)).to.be.true;
      });
    language: text/javascript
order: 6000
