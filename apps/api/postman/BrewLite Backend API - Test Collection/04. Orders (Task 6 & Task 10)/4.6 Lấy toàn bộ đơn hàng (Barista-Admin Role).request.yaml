$kind: http-request
name: 4.6 Staff đọc lịch sử của chính mình
url: "{{baseUrl}}/orders/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{baristaToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res).to.be.an('array');
      });
    language: text/javascript
order: 6000
