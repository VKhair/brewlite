$kind: http-request
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{orderId}}",
      "paymentMethod": "EWALLET",
      "mockOutcome": "SUCCESS"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const uuid = pm.variables.replaceIn('{{$guid}}');
      pm.environment.set('idempotencyKey', uuid);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.paymentStatus).to.eql('SUCCESS');
          pm.expect(res.status).to.eql('PAID');
          pm.environment.set('paymentId', res.paymentId);
      });
    language: text/javascript
order: 1000
