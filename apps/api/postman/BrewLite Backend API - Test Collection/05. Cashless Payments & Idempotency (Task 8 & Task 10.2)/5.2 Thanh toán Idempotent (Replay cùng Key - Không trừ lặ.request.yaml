$kind: http-request
name: 5.2 Thanh toán Idempotent (Replay cùng Key - Không trừ lặp)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: text
  content: |-
    {
      "orderId": {{orderId}},
      "method": "EWALLET",
      "simulateSuccess": true,
      "idempotencyKey": "{{idempotencyKey}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 hoặc 201', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test('Gửi lặp cùng Key trả về kết quả cũ: idempotent: true', function () {
          const res = pm.response.json();
          pm.expect(res.idempotent).to.be.true;
          pm.expect(res.payment.status).to.eql('SUCCESS');
          pm.expect(res.order.status).to.eql('PAID');
      });
    language: text/javascript
order: 2000
