$kind: http-request
name: 5.2 Thanh toán Idempotent (Replay cùng Key - Không trừ lặp)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{orderId}}",
      "paymentMethod": "EWALLET",
      "mockOutcome": "SUCCESS"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.paymentStatus).to.eql('SUCCESS');
          pm.expect(res.status).to.eql('PAID');
          pm.expect(res.paymentId).to.eql(pm.environment.get('paymentId'));
      });
    language: text/javascript
order: 2000
