$kind: http-request
name: 5.3 Tạo đơn hàng phụ để kiểm thử thanh toán thất bại
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "10000000-0000-4000-8000-000000000002",
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 hoặc 201 (Created)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test('Lưu secondOrderId', function () {
          const res = pm.response.json();
          pm.environment.set('secondOrderId', res.orderId);
          pm.environment.set('secondOrderCode', res.orderCode);
      });
    language: text/javascript
order: 3000
