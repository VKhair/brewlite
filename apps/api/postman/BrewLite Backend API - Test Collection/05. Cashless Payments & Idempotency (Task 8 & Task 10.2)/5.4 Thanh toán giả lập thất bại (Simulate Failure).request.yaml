$kind: http-request
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{failKey}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{secondOrderId}}",
      "paymentMethod": "CARD",
      "mockOutcome": "FAILURE"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const uuid = pm.variables.replaceIn('{{$guid}}');
      pm.variables.set('failKey', uuid);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.paymentStatus).to.eql('FAILED');
          pm.expect(res.status).to.eql('PAYMENT_FAILED');
          pm.expect(res.cartAction).to.eql('KEEP');
      });
    language: text/javascript
order: 4000
