$kind: http-request
name: 6.2 Barista pha chế xong (PREPARING -> READY)
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "READY"
    }
auth:
  type: bearer
  credentials:
    token: "{{baristaToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Đơn hàng chuyển thành READY', function () {
          const res = pm.response.json();
          pm.expect(res.status).to.eql('READY');
      });
    language: text/javascript
order: 2000
