$kind: http-request
name: 6.4 Chặn quay lui State Machine (COMPLETED -> PREPARING)
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "PREPARING"
    }
auth:
  type: bearer
  credentials:
    token: "{{baristaToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', function () {
          pm.response.to.have.status(409);
      });
      pm.test('Kiểm tra dữ liệu phản hồi', function () {
          const res = pm.response.json();
          pm.expect(res.code).to.eql('INVALID_ORDER_TRANSITION');
      });
    language: text/javascript
order: 4000
