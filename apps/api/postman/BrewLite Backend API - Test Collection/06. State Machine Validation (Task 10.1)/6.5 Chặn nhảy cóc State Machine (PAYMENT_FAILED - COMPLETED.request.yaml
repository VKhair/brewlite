$kind: http-request
name: 6.5 Chặn nhảy cóc State Machine (PAYMENT_FAILED -> COMPLETED)
url: "{{baseUrl}}/orders/{{secondOrderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "COMPLETED"
    }
auth:
  type: bearer
  credentials:
    token: "{{baristaToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 5000
