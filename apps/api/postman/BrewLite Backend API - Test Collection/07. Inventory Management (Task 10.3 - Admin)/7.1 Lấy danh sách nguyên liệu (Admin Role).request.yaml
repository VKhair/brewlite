$kind: http-request
url: "{{baseUrl}}/inventory/ingredients"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 OK cho Admin', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Trả về danh sách nguyên liệu và tồn kho', function () {
          const res = pm.response.json();
          pm.expect(Array.isArray(res)).to.be.true;
          pm.expect(res.length).to.be.greaterThan(0);
          pm.expect(res[0]).to.have.property('name');
          pm.expect(res[0]).to.have.property('onHand');
      });
    language: text/javascript
order: 1000
