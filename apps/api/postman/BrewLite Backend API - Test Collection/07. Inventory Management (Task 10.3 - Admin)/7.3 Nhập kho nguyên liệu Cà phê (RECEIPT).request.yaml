$kind: http-request
url: "{{baseUrl}}/inventory/ingredients/1/movements"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "type": "RECEIPT",
      "quantity": 500,
      "reason": "Nhập hàng bổ sung từ Postman Test"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code là 200 hoặc 201', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test('Nhập kho thành công', function () {
          const res = pm.response.json();
          pm.expect(res.name).to.eql('Cà phê');
          pm.expect(res.onHand).to.be.greaterThan(0);
      });
    language: text/javascript
order: 3000
