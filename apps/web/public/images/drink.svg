<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <!-- Background soft circle -->
  <circle cx="100" cy="100" r="90" fill="#fff7ed"/>
  <!-- Cup Body -->
  <path d="M60 70 L72 160 C73 166 78 170 85 170 L115 170 C122 170 127 166 128 160 L140 70 Z" fill="url(#cupGrad)"/>
  <!-- Cup Sleeve -->
  <path d="M65 100 L70 135 L130 135 L135 100 Z" fill="#78350f" opacity="0.85"/>
  <!-- BrewLite Coffee Bean / Leaf on Sleeve -->
  <path d="M100 110 C93 110 88 116 93 124 C97 121 103 121 107 124 C112 116 107 110 100 110 Z" fill="#fef3c7"/>
  <!-- Cup Rim & Lid -->
  <rect x="52" y="60" width="96" height="12" rx="6" fill="url(#lidGrad)"/>
  <path d="M68 60 L78 48 C80 46 84 44 88 44 L112 44 C116 44 120 46 122 48 L132 60 Z" fill="#ffedd5"/>
  <!-- Straw -->
  <rect x="110" y="24" width="8" height="26" rx="3" fill="#0284c7" transform="rotate(12 114 37)"/>
  <!-- Steam ripples -->
  <path d="M85 36 C82 30 90 26 86 20" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M98 32 C95 24 103 20 100 14" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
