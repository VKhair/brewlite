name: brewlite-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-brewlite_local_only}@postgres:5432/${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-brewlite-local-only-jwt-secret-change-before-deploy}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      BREWLITE_SEED_ON_START: "true"
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3003/payments/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:3003/payments/vnpay/ipn}
      VNPAY_FRONTEND_URL: ${VNPAY_FRONTEND_URL:-http://localhost:3002}
    ports:
      - "127.0.0.1:${API_PORT:-3003}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_PAYMENT_MODE: ${PAYMENT_MODE:-mock}
    environment:
      NODE_ENV: production
      WEB_PORT: 3000
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
